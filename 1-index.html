<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>محمد أحمد الحلواني</title>
<style>
@font-face{font-family:K;src:url(NotoKufiArabic-Regular.ttf);font-weight:300 400}
@font-face{font-family:K;src:url(NotoKufiArabic-Medium.ttf);font-weight:500}
@font-face{font-family:K;src:url(NotoKufiArabic-Bold.ttf);font-weight:600 900}
:root{--bg:#0a0b0d;--tx:#f1ebe0;--mu:#a79f8f;--g1:#f0dba8;--g2:#b8914a;--ln:rgba(214,178,105,.28)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}
body{font-family:K,sans-serif;color:var(--tx);max-width:420px;margin:0 auto;background:radial-gradient(120% 40% at 50% 38%,#17130c 0%,var(--bg) 70%);min-height:100vh;overflow-x:hidden}
.hero{position:relative;height:540px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:contrast(1.04) saturate(.92)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,13,.35) 0%,rgba(10,11,13,0) 22%,rgba(10,11,13,0) 52%,rgba(10,11,13,.85) 84%,var(--bg) 100%)}
.hero .tl,.hero .tr{position:absolute;top:16px;width:34px;height:34px;border:1.5px solid var(--g1);opacity:.85;z-index:2}
.hero .tl{right:16px;border-left:0;border-bottom:0}.hero .tr{left:16px;border-right:0;border-bottom:0}
.id{position:relative;margin-top:-128px;text-align:center;z-index:3;padding:0 22px}
.k{font-size:11px;letter-spacing:.32em;color:var(--g2);font-weight:500}
h1{margin:8px 0 0;padding-bottom:10px;font-size:35px;line-height:1.35;font-weight:800;background:linear-gradient(180deg,#fff7e0 10%,var(--g1) 55%,var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.job{margin-top:10px;font-size:16px;font-weight:500;color:var(--tx);line-height:1.7}
.corp{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.logo{width:38px;height:38px;border-radius:50%;object-fit:contain;background:#fff;box-shadow:0 0 0 1.5px var(--g2)}
.co{font-size:13px;color:var(--mu);font-weight:400}
.orn{display:flex;align-items:center;gap:10px;margin:22px 26px 6px}.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}.orn b{width:7px;height:7px;background:var(--g1);transform:rotate(45deg)}
.panel{margin:10px 18px 0;border:1px solid var(--ln);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));padding:2px 16px}
.row{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;padding:14px 0;border-bottom:1px solid rgba(214,178,105,.14)}
.panel .row:last-child{border-bottom:0}
.ic{flex:none;width:40px;height:40px;border-radius:50%;border:1.3px solid var(--g2);color:var(--g1);display:flex;align-items:center;justify-content:center;background:rgba(214,178,105,.07)}
.ic svg{width:18px;height:18px}.ic.sm{width:32px;height:32px}.ic.sm svg{width:16px;height:16px}
.t{flex:1}.t small{display:block;font-size:11px;color:var(--g2);font-weight:500;letter-spacing:.04em}
.t em{display:block;font-style:normal;font-size:16px;font-weight:500;direction:ltr;text-align:right;unicode-bidi:plaintext;color:var(--tx)}
.ar{color:var(--g2);font-size:22px;opacity:.7}
.sec{margin:28px 24px 0;font-size:12px;letter-spacing:.14em;color:var(--g1);font-weight:500;display:flex;align-items:center;gap:12px}.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--g2),transparent)}
.pay{margin:14px 18px 0;padding:18px 16px;border-radius:20px;border:1px solid var(--ln);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));text-align:center}
.ph{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--g1);font-size:16px;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#16120a;font-weight:700;font-size:15px;text-decoration:none}
.copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:10px;border-radius:22px;border:1.3px solid var(--g2);background:transparent;color:var(--g1);font-family:inherit;font-weight:500;font-size:13px}
.copy svg{width:16px;height:16px}
.qr{margin-top:14px}.qr img{width:100%;max-width:230px;display:block;margin:0 auto;border-radius:12px;background:#fff;padding:6px}
.num{font-size:22px;font-weight:500;direction:ltr;letter-spacing:.05em;margin:2px 0 4px}.num.sm{font-size:16px;margin:14px 0 0;color:var(--g1)}
.cta{display:block;margin:30px auto 44px;width:calc(100% - 36px);height:54px;border:0;border-radius:27px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#16120a;font-family:inherit;font-weight:700;font-size:16px;box-shadow:0 10px 26px rgba(184,145,74,.25)}
</style>
</head><body><div id="app"></div>
<script>
const SV={
phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/></svg>',
copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>',
facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>',
instagram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.0301.084c-1.2768.0602-2.1487.264-2.911.5634-.7888.3075-1.4575.72-2.1228 1.3877-.6652.6677-1.075 1.3368-1.3802 2.127-.2954.7638-.4956 1.6365-.552 2.914-.0564 1.2775-.0689 1.6882-.0626 4.947.0062 3.2586.0206 3.6671.0825 4.9473.061 1.2765.264 2.1482.5635 2.9107.308.7889.72 1.4573 1.388 2.1228.6679.6655 1.3365 1.0743 2.1285 1.38.7632.295 1.6361.4961 2.9134.552 1.2773.056 1.6884.069 4.9462.0627 3.2578-.0062 3.668-.0207 4.9478-.0814 1.28-.0607 2.147-.2652 2.9098-.5633.7889-.3086 1.4578-.72 2.1228-1.3881.665-.6682 1.0745-1.3378 1.3795-2.1284.2957-.7632.4966-1.636.552-2.9124.056-1.2809.0692-1.6898.063-4.948-.0063-3.2583-.021-3.6668-.0817-4.9465-.0607-1.2797-.264-2.1487-.5633-2.9117-.3084-.7889-.72-1.4568-1.3876-2.1228C21.2982 1.33 20.628.9208 19.8378.6165 19.074.321 18.2017.1197 16.9244.0645 15.6471.0093 15.236-.005 11.977.0014 8.718.0076 8.31.0215 7.0301.0839m.1402 21.6932c-1.17-.0509-1.8053-.2453-2.2287-.408-.5606-.216-.96-.4771-1.3819-.895-.422-.4178-.6811-.8186-.9-1.378-.1644-.4234-.3624-1.058-.4171-2.228-.0595-1.2645-.072-1.6442-.079-4.848-.007-3.2037.0053-3.583.0607-4.848.05-1.169.2456-1.805.408-2.2282.216-.5613.4762-.96.895-1.3816.4188-.4217.8184-.6814 1.3783-.9003.423-.1651 1.0575-.3614 2.227-.4171 1.2655-.06 1.6447-.072 4.848-.079 3.2033-.007 3.5835.005 4.8495.0608 1.169.0508 1.8053.2445 2.228.408.5608.216.96.4754 1.3816.895.4217.4194.6816.8176.9005 1.3787.1653.4217.3617 1.056.4169 2.2263.0602 1.2655.0739 1.645.0796 4.848.0058 3.203-.0055 3.5834-.061 4.848-.051 1.17-.245 1.8055-.408 2.2294-.216.5604-.4763.96-.8954 1.3814-.419.4215-.8181.6811-1.3783.9-.4224.1649-1.0577.3617-2.2262.4174-1.2656.0595-1.6448.072-4.8493.079-3.2045.007-3.5825-.006-4.848-.0608M16.953 5.5864A1.44 1.44 0 1 0 18.39 4.144a1.44 1.44 0 0 0-1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg>',
telegram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>'
};
fetch('data.json?'+Date.now()).then(r=>r.json()).then(c=>{
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=n=>{n=String(n||'').replace(/\D/g,'');return n.length==11?n.slice(0,4)+' '+n.slice(4,7)+' '+n.slice(7):n};
const intl=n=>'+20'+String(n).replace(/\D/g,'').replace(/^0/,'');
const row=(i,l,v,h)=>`<a class="row" href="${e(h)}"><span class="ic">${i}</span><span class="t"><small>${e(l)}</small><em>${e(v)}</em></span><span class="ar">‹</span></a>`;
const cp=(l,v)=>`<button class="copy" type="button" data-v="${e(v)}">${SV.copy}<span>${e(l)}</span></button>`;
const ph=(t,b)=>`<div class="pay"><div class="ph"><span class="ic sm">${SV.wallet}</span>${t}</div>${b}</div>`;
document.title=c.name;
const contacts=[];
if(c.phone){contacts.push(row(SV.phone,'اتصال',fmt(c.phone),'tel:'+intl(c.phone)));contacts.push(row(SV.whatsapp,'واتساب',fmt(c.phone),'https://wa.me/'+intl(c.phone).slice(1)))}
if(c.phone2)contacts.push(row(SV.phone,'اتصال فقط',fmt(c.phone2),'tel:'+intl(c.phone2)));
const social=[];
if(c.facebook)social.push(row(SV.facebook,'فيسبوك',c.facebookLabel||c.facebook,c.facebook));
if(c.instagram)social.push(row(SV.instagram,'إنستجرام',c.instagramLabel||c.instagram,c.instagram));
if(c.telegram)social.push(row(SV.telegram,'تيليجرام',c.telegramLabel||c.telegram,c.telegram));
const pay=[];
if(c.vodafoneNumber||c.vodafoneLink)pay.push(ph('فودافون كاش',(c.vodafoneLink?`<a class="btn" href="${e(c.vodafoneLink)}">حوّل فلوس عبر فودافون كاش</a>`:'')+(c.vodafoneNumber?`<div class="num ${c.vodafoneLink?'sm':''}">${e(fmt(c.vodafoneNumber))}</div>`+(c.vodafoneLink?'':cp('نسخ الرقم',c.vodafoneNumber)):'')+(c.vodafoneQr?`<div class="qr"><img src="${e(c.vodafoneQr)}" alt=""></div>`:'')));
if(c.instapayLink||c.instapayIpa)pay.push(ph('إنستاباي',(c.instapayLink?`<a class="btn" href="${e(c.instapayLink)}">ادفع عبر إنستاباي</a>`:'')+(c.instapayIpa?cp('نسخ العنوان '+c.instapayIpa,c.instapayIpa):'')+(c.instapayQr?`<div class="qr"><img src="${e(c.instapayQr)}" alt=""></div>`:'')));
if(c.etisalatNumber)pay.push(ph('اتصالات كاش',`<div class="num">${e(fmt(c.etisalatNumber))}</div>`+cp('نسخ الرقم',c.etisalatNumber)));
document.getElementById('app').innerHTML=`<div class="hero"><img src="${e(c.photo)}" alt="${e(c.name)}"><i class="tl"></i><i class="tr"></i></div>
<div class="id"><h1>${e(c.name)}</h1><div class="job">${e(c.job)}</div><div class="corp">${c.logo?`<img class="logo" src="${e(c.logo)}" alt="">`:''}<span class="co">${e(c.company)}</span></div></div>
<div class="orn"><i></i><b></b><i></i></div>
<div class="panel">${contacts.join('')}</div>
${social.length?`<div class="sec">حساباتي</div><div class="panel">${social.join('')}</div>`:''}
${pay.length?`<div class="sec">استقبال الأموال</div>${pay.join('')}`:''}
<button class="cta" id="sv" type="button">حفظ في جهات الاتصال</button>`;
document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{const v=b.dataset.v;const t=b.querySelector('span');const o=t.textContent;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});t.textContent='تم النسخ';setTimeout(()=>t.textContent=o,1500)});
document.getElementById('sv').onclick=()=>{const p=c.name.trim().split(/\s+/);const L=['BEGIN:VCARD','VERSION:3.0','FN:'+c.name,'N:'+p.slice(-1)[0]+';'+p.slice(0,-1).join(' ')+';;;'];
if(c.company)L.push('ORG:'+c.company);if(c.job)L.push('TITLE:'+c.job);
if(c.phone)L.push('TEL;TYPE=CELL,VOICE:'+intl(c.phone));if(c.phone2)L.push('TEL;TYPE=CELL,VOICE:'+intl(c.phone2));
if(c.telegram)L.push('URL:'+c.telegram);L.push('END:VCARD');
const b=new Blob([L.join('\r\n')],{type:'text/vcard'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contact.vcf';document.body.appendChild(a);a.click();a.remove()};
});
</script></body></html>
